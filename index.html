<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#172033">
<title>風袋計算</title>
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#172033;--muted:#647084;--line:#dce2eb;--accent:#172033}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;color:var(--ink)}
main{max-width:760px;margin:auto;padding:18px 14px 48px}
.title{font-size:30px;font-weight:900;margin:8px 0 4px}.sub{color:var(--muted);font-weight:700;margin-bottom:18px}
.card{background:var(--card);border-radius:24px;padding:20px;margin:14px 0;box-shadow:0 8px 24px rgba(20,35,60,.08)}
h2{margin:0 0 16px;font-size:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
label{display:block;font-weight:800;font-size:15px;margin:0 0 6px}
input,select,button{width:100%;font:inherit;border-radius:14px}
input,select{padding:14px;border:2px solid var(--line);background:#fff;color:var(--ink);font-weight:700}
button{padding:18px;border:0;background:var(--accent);color:#fff;font-weight:900;font-size:22px;margin-top:10px}
.hint{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.55}
.results .row{display:flex;justify-content:space-between;gap:10px;padding:17px 0;border-bottom:1px solid var(--line);font-size:20px;font-weight:800}
.results .row b{font-size:30px;white-space:nowrap}
.total{margin-top:18px;padding:18px;border-radius:22px;background:#e9eef8}
.total small{display:block;font-weight:800}.total b{font-size:46px}
.err{color:#b42318;font-weight:800;margin-top:12px;white-space:pre-line}
.ok{color:#1a6d40;font-weight:800;margin-top:12px;white-space:pre-line}
</style>
</head>
<body>
<main>
<div class="title">風袋計算</div>
<div class="sub">紙管・鉄リング・間紙・テープを自動計算</div>

<section class="card">
<h2>① 基本情報</h2>
<div class="grid">
<div><label>FNo</label><input id="fno" type="text" placeholder="任意"></div>
<div><label>コイルNo</label><input id="coilNo" type="text" placeholder="任意"></div>
<div><label>総重量（kg）</label><input id="totalKg" type="number" step="0.1" inputmode="decimal" placeholder="例：1530"></div>
<div><label>製品幅（mm）</label><input id="width" type="number" step="1" inputmode="decimal" placeholder="例：400"></div>
<div><label>製品厚み（mm）</label><input id="thickness" type="number" step="0.01" inputmode="decimal" placeholder="例：0.50"></div>
</div>
<div class="hint">間紙とテープは、この「製品厚み」と「総重量」を使って換算表から計算します。間紙用・テープ用の別の厚み入力はありません。</div>
</section>

<section class="card">
<h2>② 紙管・鉄リング</h2>
<div class="grid">
<div><label>種類</label><select id="tubeType">
<option value="none">なし</option>
<option value="normal">普通紙管</option>
<option value="hard">硬強度紙管</option>
<option value="hard10">硬強度紙管 10mm</option>
<option value="hard15">硬強度紙管 15mm</option>
<option value="ring">鉄リング</option>
</select></div>
<div><label>内径</label><select id="diameter">
<option value="300">φ300</option>
<option value="400">φ400</option>
<option value="500" selected>φ500</option>
</select></div>
</div>
<div id="tubeHint" class="hint"></div>
</section>

<section class="card">
<h2>③ 間紙</h2>
<label>紙の有無</label>
<select id="paperUse">
<option value="none">紙なし</option>
<option value="use">紙入り</option>
</select>
<div class="hint">紙入りなら、製品厚み＋総重量から間紙換算質量表を使って自動計算します。</div>
</section>

<section class="card">
<h2>④ テープ</h2>
<label>テープ種類</label>
<select id="tapeType">
<option value="none">なし</option>
<option value="SPV">SPV</option>
<option value="SPH">SPH</option>
<option value="SPE">SPE</option>
</select>
<div class="hint">テープも製品厚み＋総重量から、選択したSPV・SPH・SPEの換算表で自動計算します。</div>
</section>

<section class="card results">
<h2>計算結果</h2>
<div class="row"><span>紙管・鉄リング</span><b id="tubeResult">0.00 kg</b></div>
<div class="row"><span>間紙</span><b id="paperResult">0.00 kg</b></div>
<div class="row"><span>テープ</span><b id="tapeResult">0.00 kg</b></div>
<div class="total"><small>合計控除重量</small><b id="deductResult">0.00 kg</b></div>
<div id="message"></div>
<button id="calc" type="button">計算する</button>
</section>
</main>

<script>
const $=id=>document.getElementById(id);

// 紙管・パイプリング比重表
const tubeCoeff={
 normal:{300:0.0168,400:0.0216,500:0.0270},
 hard:{300:0.0178,400:0.0220,500:0.0310},
 hard10:{300:0.0089,500:0.0148},
 hard15:{300:0.0128,500:0.0223},
 ring:{300:0.0556,400:0.0615,500:0.0785}
};

// 換算表の重量列
const cols=[50,100,200,300,400,500,600,700,800,900,1000];

// 間紙換算質量表
const PAPER={
"0.10":[1.8,3.5,7.0,10.5,14.0,17.5,21.0,24.5,28.0,31.5,35.0],
"0.12":[1.5,2.9,5.8,8.7,11.6,14.5,17.4,20.3,23.2,26.1,29.2],
"0.15":[1.2,2.3,4.7,7.0,9.3,11.7,14.0,16.3,18.7,21.0,23.3],
"0.18":[1.0,1.9,3.6,5.8,7.8,9.7,11.7,13.6,15.6,17.5,19.4],
"0.20":[0.9,1.7,3.4,5.1,6.8,8.5,10.2,11.9,13.6,15.3,17.0],
"0.25":[0.7,1.4,2.7,4.1,5.4,6.8,8.2,9.5,10.9,12.3,13.6],
"0.30":[0.6,1.1,2.3,3.4,4.5,5.7,6.8,8.0,9.1,10.2,11.4],
"0.35":[0.5,1.0,1.9,2.9,3.9,4.7,5.8,6.8,7.8,8.8,9.7],
"0.40":[0.4,0.9,1.7,2.6,3.4,4.3,5.1,6.0,6.8,7.7,8.5],
"0.45":[0.4,0.8,1.5,2.3,3.0,3.8,4.5,5.3,6.0,6.8,7.6],
"0.50":[0.3,0.7,1.4,2.0,2.7,3.4,4.1,4.8,5.5,6.1,6.8],
"0.60":[0.3,0.6,1.1,1.7,2.3,2.8,3.4,4.0,4.5,5.1,5.7],
"0.70":[0.2,0.5,1.0,1.5,1.9,2.4,2.9,3.4,3.9,4.4,4.9],
"0.80":[0.2,0.4,0.9,1.3,1.7,2.1,2.6,3.0,3.4,3.8,4.3],
"1.00":[0.2,0.3,0.7,1.0,1.4,1.7,2.1,2.4,2.7,3.1,3.4],
"1.20":[0.1,0.3,0.6,0.9,1.1,1.4,1.7,2.0,2.3,2.6,2.8],
"1.40":[0.1,0.2,0.5,0.7,1.0,1.2,1.5,1.7,1.9,2.2,2.4],
"1.60":[0.1,0.2,0.4,0.6,0.9,1.1,1.3,1.5,1.7,1.9,2.1],
"2.00":[0.1,0.2,0.4,0.5,0.7,0.9,1.1,1.2,1.4,1.6,1.8]
};

const SPV={
"0.20":[4.70,9.30,18.60,27.90,37.30,46.60,55.90,65.20,74.50,83.90,93.20],
"0.30":[3.20,6.40,12.80,19.30,25.70,32.20,38.60,45.00,51.50,57.90,64.40],
"0.40":[2.40,4.90,9.80,14.60,19.60,24.40,29.30,34.20,39.00,44.00,48.80],
"0.50":[2.00,4.00,7.90,11.80,15.80,19.70,23.70,27.60,31.50,35.50,39.40],
"0.60":[1.70,3.30,6.60,10.00,13.30,16.60,19.90,23.20,26.60,29.90,33.20],
"0.70":[1.40,2.90,5.70,8.60,11.40,14.30,17.20,20.00,22.90,25.70,28.60],
"0.80":[1.30,2.50,5.10,7.60,10.10,12.60,15.10,17.70,20.20,22.70,25.20],
"0.90":[1.10,2.30,4.40,6.60,8.80,11.10,13.20,15.50,17.70,19.90,22.20],
"1.00":[1.00,2.00,4.00,6.00,8.10,10.10,12.10,14.10,16.10,18.10,20.20],
"1.20":[0.90,1.70,3.40,5.10,6.80,8.50,10.20,11.90,13.60,15.30,17.00],
"1.40":[0.70,1.50,2.60,4.30,5.70,7.20,8.60,10.00,11.50,12.80,14.30],
"1.60":[0.60,1.30,2.50,3.80,5.00,6.30,7.60,8.80,10.10,11.40,12.60]
};
const SPH={
"0.20":[3.00,6.00,11.80,17.70,23.60,29.50,35.40,41.30,47.20,53.10,59.00],
"0.30":[2.00,4.00,7.80,11.80,15.70,19.70,23.60,27.50,31.40,35.40,39.40],
"0.40":[1.50,3.00,6.00,8.80,11.80,14.70,17.70,20.60,23.60,26.50,29.50],
"0.50":[1.20,2.40,4.80,7.20,9.60,12.00,14.40,16.80,19.20,21.60,24.00],
"0.60":[1.00,2.00,4.00,6.00,7.80,9.80,11.80,13.80,15.70,17.70,19.70],
"0.70":[0.80,1.70,3.40,5.10,6.80,8.60,10.30,12.00,13.70,15.40,17.20],
"0.80":[0.70,1.40,3.00,4.40,6.00,7.40,8.80,10.30,11.80,13.30,14.80],
"0.90":[0.60,1.30,2.60,4.00,5.20,6.50,7.80,9.10,10.40,11.70,13.00],
"1.00":[0.60,1.20,2.40,3.60,4.80,6.00,7.20,8.40,9.60,10.80,12.00],
"1.20":[0.50,1.00,2.00,3.00,4.00,5.00,6.00,7.00,7.80,9.00,10.00],
"1.40":[0.40,0.80,1.70,2.50,3.40,4.30,5.10,6.00,6.80,7.70,8.60],
"1.60":[0.30,0.70,1.40,2.20,3.00,3.70,4.40,5.10,6.00,6.60,7.40]
};
const SPE={
"0.20":[2.00,3.60,7.20,11.00,14.40,18.00,21.60,25.20,28.80,32.40,36.00],
"0.30":[1.20,2.40,4.80,7.20,9.60,12.00,14.40,16.80,19.20,21.60,24.00],
"0.40":[1.00,1.80,3.60,5.40,7.20,9.00,10.80,12.60,14.40,16.20,18.00],
"0.50":[0.70,1.50,3.00,4.30,5.70,7.20,8.60,10.00,11.50,13.00,14.40],
"0.60":[0.60,1.20,2.40,3.60,4.80,6.00,7.20,8.40,9.60,10.80,12.00],
"0.70":[0.50,1.00,2.00,3.00,4.00,5.20,6.20,7.30,8.30,9.30,10.40],
"0.80":[0.40,1.00,1.80,2.70,3.60,4.50,5.40,6.30,7.20,8.10,9.00],
"0.90":[0.40,0.90,1.70,2.60,3.40,4.40,5.30,6.20,7.00,7.90,8.80],
"1.00":[0.40,0.80,1.60,2.40,3.20,4.00,4.80,5.60,6.40,7.20,8.00],
"1.20":[0.30,0.70,1.40,2.10,2.80,3.00,3.60,4.20,4.80,5.40,6.00],
"1.40":[0.20,0.50,1.00,1.50,2.00,2.60,3.10,3.60,4.10,4.60,5.20],
"1.60":[0.20,0.40,0.90,1.30,1.80,2.20,2.70,3.10,3.60,4.00,4.50]
};

function nearestKey(table,t){
 const ks=Object.keys(table).map(Number);
 return ks.reduce((a,b)=>Math.abs(b-t)<Math.abs(a-t)?b:a);
}
function valueAt(table,key,kg){
 const row=table[Number(key).toFixed(2)]||table[String(key)];
 const idx=cols.indexOf(kg);
 return idx>=0?row[idx]:0;
}
// 例 1530 = 1000 + 500 + 300の1/10
function calcByTable(table,t,total){
 const key=nearestKey(table,t);
 let rem=Math.max(0,total), sum=0, detail=[];
 const major=[1000,900,800,700,600,500,400,300,200,100,50];
 for(const kg of major){
   while(rem>=kg-1e-9){
     sum+=valueAt(table,key,kg);
     detail.push(kg+"kg");
     rem-=kg;
   }
 }
 if(rem>0.0001){
   const ten=Math.round(rem/10)*10;
   if(ten>=10 && ten<=100 && Math.abs(rem-ten)<0.001){
     const ref=ten*10;
     sum+=valueAt(table,key,ref)*0.1;
     detail.push(ref+"kgの1/10");
     rem=0;
   }else{
     sum+=valueAt(table,key,50)*(rem/50);
     detail.push(rem.toFixed(1)+"kg比例");
     rem=0;
   }
 }
 return {value:sum,key,detail:detail.join(" + ")};
}

function updateTube(){
 const type=$("tubeType").value;
 const dia=$("diameter");
 let allowed=[300,400,500];
 if(type==="hard10")allowed=[300,500];
 if(type==="hard15")allowed=[300,500];
 dia.innerHTML=allowed.map(v=>`<option value="${v}">φ${v}</option>`).join("");
 if(allowed.includes(500))dia.value="500";
 const c=(tubeCoeff[type]||{})[dia.value];
 $("tubeHint").textContent=type==="none"?"なし":(c!==undefined?`係数 ${c} × 製品幅(mm)`:"この組み合わせは未登録");
}
$("tubeType").addEventListener("change",updateTube);
$("diameter").addEventListener("change",updateTube);

function calc(){
 const total=Number($("totalKg").value);
 const width=Number($("width").value);
 const thick=Number($("thickness").value);
 const msg=$("message"); msg.className="";

 if(!(total>0) || !(width>0) || !(thick>0)){
   msg.textContent="総重量・製品幅・製品厚みを入力してください。";
   msg.className="err"; return;
 }

 const type=$("tubeType").value, dia=Number($("diameter").value);
 const coef=(tubeCoeff[type]||{})[dia];
 if(type!=="none" && coef===undefined){
   msg.textContent="選択した紙管・鉄リングと内径の係数がありません。";
   msg.className="err"; return;
 }
 const tube=type==="none"?0:coef*width;

 let paperW=0, tapeW=0, details=[];
 if($("paperUse").value==="use"){
   const r=calcByTable(PAPER,thick,total);
   paperW=r.value;
   details.push(`間紙：厚み${r.key.toFixed(2)}mm / ${r.detail}`);
 }

 const tapeType=$("tapeType").value;
 if(tapeType!=="none"){
   const table={SPV,SPH,SPE}[tapeType];
   const r=calcByTable(table,thick,total);
   tapeW=r.value;
   details.push(`${tapeType}：厚み${r.key.toFixed(2)}mm / ${r.detail}`);
 }

 const deduct=tube+paperW+tapeW;
 $("tubeResult").textContent=tube.toFixed(2)+" kg";
 $("paperResult").textContent=paperW.toFixed(2)+" kg";
 $("tapeResult").textContent=tapeW.toFixed(2)+" kg";
 $("deductResult").textContent=deduct.toFixed(2)+" kg";
 msg.textContent="計算完了"+(details.length?"\n"+details.join("\n"):"");
 msg.className="ok";
}
$("calc").addEventListener("click",calc);
["totalKg","width","thickness","paperUse","tapeType"].forEach(id=>{
 $(id).addEventListener("change",()=>{if($("totalKg").value&&$("width").value&&$("thickness").value)calc();});
});
updateTube();
</script>
</body>
</html>
