<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>風袋計算 AI伝票読取 V11</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#eef1f6;color:#172033}.wrap{max-width:760px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 2px 12px #0001}h1{font-size:24px;margin:4px 0 10px}h2{font-size:18px;margin:0 0 12px}button,label.btn{display:block;width:100%;box-sizing:border-box;border:0;border-radius:14px;padding:16px;font-size:18px;font-weight:700;text-align:center;background:#1769e0;color:#fff;margin:10px 0}button:disabled{opacity:.45}input[type=file]{display:none}img{width:100%;border-radius:12px;display:none}.rowpick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.rowpick label{font-size:13px;color:#657084;font-weight:700}.rowpick select{width:100%;box-sizing:border-box;padding:14px;border:2px solid #1769e0;border-radius:12px;background:#fff;font-size:22px;font-weight:800}.result{border-top:1px solid #e2e7ef;padding-top:14px;margin-top:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{padding:10px;border:2px solid #d8deea;border-radius:12px}.field.bad{border-color:#e5484d;background:#fff0f0}.field.good{border-color:#2b9a66;background:#effbf5}.field label{font-size:12px;color:#657084}.field input,.field select{width:100%;box-sizing:border-box;border:0;background:transparent;font-size:19px;padding:6px 0;outline:none}.note{font-size:13px;color:#657084;line-height:1.5}.status{font-weight:700;line-height:1.5}.endpoint{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd3df;border-radius:10px;font-size:16px}pre{white-space:pre-wrap;word-break:break-word;background:#f5f7fa;padding:10px;border-radius:10px;font-size:12px}.badmsg{color:#b42318}
</style>
</head>
<body><div class="wrap">
<h1>📷 AI伝票読取 V11</h1>
<div class="card">
<div class="status" id="status">伝票を1枚撮影してください。</div>
<label class="btn" for="photo">伝票を撮る / 写真を選ぶ</label>
<input id="photo" type="file" accept="image/*" capture="environment">
<img id="preview">
<h2 style="margin-top:16px">読む行を指定</h2>
<div class="note">行番号は <b>下から1・2・3・4・5</b> です。</div>
<div class="rowpick"><div><label for="row1">読む行①</label><select id="row1"><option value="1">下から1</option><option value="2">下から2</option><option value="3">下から3</option><option value="4">下から4</option><option value="5">下から5</option></select></div><div><label for="row2">読む行②</label><select id="row2"><option value="">なし</option><option value="1">下から1</option><option value="2" selected>下から2</option><option value="3">下から3</option><option value="4">下から4</option><option value="5">下から5</option></select></div></div>
<button id="readBtn" disabled>指定した行をAIで読む</button>
<div class="note">V11：まず各行の印字をそのまま読み、間紙・P/T・仕上げ記号を別々に判定します。FNoは伝票上部の共通番号だけを読みます。読めなかった項目は赤で残します。</div>
</div>
<div class="card"><h2>読取結果</h2><div id="results"></div></div>
<div class="card"><h2>接続設定</h2><input class="endpoint" id="endpoint" value="https://tare-slip-ai.ezsdq65x.workers.dev"><p class="note">接続先は保存されます。APIキーはこのHTMLには入っていません。</p></div>
<div class="card"><details><summary>診断情報</summary><pre id="debug">まだありません</pre></details></div>
</div>
<script>
let dataUrl="";const endpointEl=document.getElementById("endpoint"),savedEndpoint=localStorage.getItem("tareAiEndpoint");if(savedEndpoint)endpointEl.value=savedEndpoint;endpointEl.addEventListener("change",()=>localStorage.setItem("tareAiEndpoint",endpointEl.value.trim()));const photo=document.getElementById("photo"),preview=document.getElementById("preview"),readBtn=document.getElementById("readBtn"),statusEl=document.getElementById("status"),debugEl=document.getElementById("debug"),resultsEl=document.getElementById("results");photo.onchange=()=>{const f=photo.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{dataUrl=r.result;preview.src=dataUrl;preview.style.display="block";readBtn.disabled=false;statusEl.textContent="写真OK。下からの行番号を選んでください。"};r.readAsDataURL(f)};function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}function opts(values,v){return '<option value=""></option>'+values.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('')}function field(label,key,val,type="input"){const ok=String(val??"").trim()!=="";if(type==="inner")return `<div class="field ${ok?'good':'bad'}"><label>${label}</label><select data-key="${key}">${opts(["300","400","500"],val)}</select></div>`;if(type==="paper")return `<div class="field ${ok?'good':'bad'}"><label>${label}</label><select data-key="${key}">${opts(["あり","なし"],val)}</select></div>`;if(type==="ring")return `<div class="field ${ok?'good':'bad'}"><label>${label}</label><select data-key="${key}">${opts(["P","T","なし"],val)}</select></div>`;if(type==="core")return `<div class="field ${ok?'good':'bad'}"><label>${label}</label><select data-key="${key}">${opts(["普通紙管","硬強度","鉄リング","なし"],val)}</select></div>`;if(type==="tape")return `<div class="field ${ok?'good':'bad'}"><label>${label}</label><select data-key="${key}">${opts(["SPE","SPV","SPH","なし"],val)}</select></div>`;return `<div class="field ${ok?'good':'bad'}"><label>${label}</label><input data-key="${key}" value="${esc(val)}"></div>`}function render(rows){resultsEl.innerHTML="";rows.forEach(r=>{const box=document.createElement("div");box.className="result";box.innerHTML=`<h2>下から${esc(r.row)}行目</h2><div class="grid">${field("厚み","thickness",r.thickness)}${field("幅","width",r.width)}${field("内径","inner",r.inner,"inner")}${field("間紙","paper",r.paper,"paper")}${field("リング/紙管","ring",r.ring,"ring")}${field("紙管種類","core",r.core,"core")}${field("テープ","tape",r.tape,"tape")}${field("FNo","fno",r.fno)}</div>`;resultsEl.appendChild(box)});resultsEl.querySelectorAll("input,select").forEach(el=>{el.addEventListener("input",()=>{const f=el.closest(".field");f.className="field "+(el.value.trim()?"good":"bad")})})}async function readSlip(){const endpoint=endpointEl.value.trim();if(!endpoint){statusEl.textContent="⚠️ AI中継URLが未設定です。";return}const rows=[document.getElementById("row1").value,document.getElementById("row2").value].filter(Boolean).map(Number);if(new Set(rows).size!==rows.length){statusEl.textContent="⚠️ 同じ行番号が2つ選ばれています。";return}localStorage.setItem("tareAiEndpoint",endpoint);statusEl.textContent="AI読取中…";readBtn.disabled=true;try{const res=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({image:dataUrl,rows})});const j=await res.json();debugEl.textContent=JSON.stringify(j,null,2);if(!res.ok||j.error)throw new Error(j.details||j.error||("HTTP "+res.status));if(!Array.isArray(j.rows))throw new Error("行データが返ってきませんでした");render(j.rows);statusEl.textContent="読取完了。緑＝読取、赤＝確認・手入力。"}catch(e){statusEl.innerHTML='<span class="badmsg">❌ '+esc(e.message)+'</span>'}finally{readBtn.disabled=false}}readBtn.onclick=readSlip;
</script>
</body></html>
